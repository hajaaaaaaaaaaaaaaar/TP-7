
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chatbot Nova</title>

    <!-- Police Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
          rel="stylesheet">

    <!-- Feuille CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <img src="images/avatar.png" alt="Avatar de Nova">
        <h1>Nova</h1>
    </header>

    <!-- Historique -->
    <nav class="historique">
        <h2>Historique</h2>

        <ul>
            <li><a href="#">Conversation 1</a></li>
            <li><a href="#">Conversation 2</a></li>
            <li><a href="#">Conversation 3</a></li>
            <li><a href="#">Conversation 4</a></li>
        </ul>
    </nav>

    <!-- Conversation principale -->
    <main>

        <section class="conversation">

            <p class="message bot">
                Bonjour ! Comment puis-je vous aider ?
            </p>

            <p class="message user">
                Quels sont vos horaires ?
            </p>

            <p class="message bot">
                Du lundi au samedi, de 9h à 18h.
            </p>

        </section>

        <form>
            <input type="text"
                   placeholder="Écrivez votre message..."
                   aria-label="Votre message"
                   required>

            <button type="submit">Envoyer</button>
        </form>

    </main>

    <!-- Aside -->
    <aside>
        <h2>Informations</h2>
        <p>Je suis Nova, votre assistant virtuel.</p>
    </aside>

    <!-- Footer -->
    <footer>
        <p>© 2026 Chatbot Nova</p>
    </footer>

</body>
</html>
